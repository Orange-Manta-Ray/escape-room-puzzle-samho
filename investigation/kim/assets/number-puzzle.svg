<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-label="숫자 규칙 문제. 973은 190, 189는 빈 네모, 72는 15, 14는 5입니다. 네모에 들어갈 값을 구하세요.">
<defs><pattern id="paper" width="960" height="48" patternUnits="userSpaceOnUse"><path d="M0 47H960" stroke="#c7c4b6" stroke-opacity=".4"/></pattern></defs>
<rect width="960" height="720" fill="#f6f2e6"/><rect width="960" height="720" fill="url(#paper)"/>
<g font-family="-apple-system, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#252922" text-anchor="middle">
<text x="480" y="82" font-size="23" font-weight="700" letter-spacing="4">EVIDENCE / NUMBER CODE</text>
<text x="480" y="148" font-size="39" font-weight="800">네모에 들어갈 값은?</text>
<text x="480" y="205" font-size="26">숫자 사이의 규칙을 찾아보세요.</text>
<g font-size="54" font-weight="700"><text x="420" y="300" text-anchor="end">973</text><text x="480" y="300">=</text><text x="540" y="300" text-anchor="start">190</text><text x="420" y="395" text-anchor="end">189</text><text x="480" y="395">=</text><text x="420" y="490" text-anchor="end">72</text><text x="480" y="490">=</text><text x="540" y="490" text-anchor="start">15</text><text x="420" y="585" text-anchor="end">14</text><text x="480" y="585">=</text><text x="540" y="585" text-anchor="start">5</text></g>
<rect x="540" y="337" width="72" height="72" fill="#fffdf5" stroke="#665a36" stroke-width="4"/>
<text x="480" y="665" font-size="25">빈 네모에 들어갈 숫자를 입력하세요.</text>
</g></svg>
