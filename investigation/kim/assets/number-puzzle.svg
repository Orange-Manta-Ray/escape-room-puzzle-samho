<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-label="각 자릿수를 곱하는 규칙: 973, 189, 빈 네모, 14, 4. 빈 네모의 값을 구하세요.">
<defs><pattern id="paper" width="960" height="48" patternUnits="userSpaceOnUse"><path d="M0 47H960" stroke="#c7c4b6" stroke-opacity=".4"/></pattern></defs>
<rect width="960" height="720" fill="#f6f2e6"/><rect width="960" height="720" fill="url(#paper)"/>
<g font-family="-apple-system, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#252922" text-anchor="middle">
<text x="480" y="85" font-size="23" font-weight="700" letter-spacing="4">EVIDENCE / NUMBER CODE</text>
<text x="480" y="152" font-size="39" font-weight="800">네모에 들어갈 값은?</text>
<text x="480" y="217" font-size="26">각 숫자의 자릿수를 곱하면 다음 숫자가 됩니다.</text>
<g font-size="50" font-weight="700"><text x="122" y="350">973</text><text x="300" y="350">189</text><text x="658" y="350">14</text><text x="837" y="350">4</text></g>
<g font-size="38" fill="#7d714a"><text x="212" y="347">→</text><text x="390" y="347">→</text><text x="568" y="347">→</text><text x="748" y="347">→</text></g>
<rect x="435" y="287" width="90" height="90" fill="#fffdf5" stroke="#665a36" stroke-width="4"/>
<path d="M95 453H865" stroke="#b4ab91"/>
<text x="480" y="520" font-size="27">예시: 973 → 9 × 7 × 3 = 189</text>
<text x="480" y="587" font-size="25">빈 네모에 들어갈 숫자를 입력하세요.</text>
</g></svg>
